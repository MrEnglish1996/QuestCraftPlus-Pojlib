plugins {
    id 'java'
}

group = 'org.lwjgl.glfw'

configurations.default.setCanBeResolved(true)

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = "lwjgl-glfw-classes"
    destinationDirectory.set(file("../src/main/assets/lwjgl/"))
    // Auto update the version with a timestamp so the project jar gets updated by Pojav
    File versionFile = file("../src/main/assets/lwjgl/version")
    versionFile.write(String.valueOf(new Date().getTime()))
    from {
        configurations.default.collect {
            println(it.getName())
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'net/java/openjdk/cacio/ctc/**'
    // Multi-release-jar variant classes (org.lwjgl core ships Java 11/17/21 bytecode variants of a
    // few perf-sensitive classes under here). We don't set Multi-Release: true in the manifest, so
    // the JVM never loads these anyway - they're dead weight that Jetifier chokes on regardless
    // (it doesn't understand newer class file versions), so strip them from the merge entirely.
    exclude 'META-INF/versions/**'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
